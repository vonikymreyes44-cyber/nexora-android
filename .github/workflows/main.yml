
name: Build NEXORA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXORA-Android-Project-FIXED.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q NEXORA-Android-Project-FIXED.zip
          ls -la NEXORA-Android

      - name: Build APK
        working-directory: NEXORA-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Business-Suite-APK
          path: NEXORA-Android/app/build/outputs/apk/debug/app-debug.apk
          
